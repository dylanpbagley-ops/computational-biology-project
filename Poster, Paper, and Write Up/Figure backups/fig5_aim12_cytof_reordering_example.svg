   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', sans-serif" transform="translate(120.484076 122.480632)">Naive ranking</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', sans-serif" transform="translate(100.066185 134.798226)">(mean CD19 density)</text>

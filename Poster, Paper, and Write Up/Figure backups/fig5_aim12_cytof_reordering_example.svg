   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif" transform="translate(88.964875 54.181281)">Naive vs. model-based top-5 CAR-T target ranking</text>
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif" transform="translate(123.706359 68.84)">(mean CD19 density vs. escape fraction)</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans', sans-serif" transform="translate(0.887938 431.036275)">41-patient DLBCL CyTOF cohort, gated tumor B cells, CLN-978_cytolysis calibration, kill_threshold=0.5 (antigen-density</text>
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans', sans-serif" transform="translate(8.182531 441.594137)">threshold n* = 81 molecules/cell). O8155 (mean 176.9) and Q5971 (mean 178.8) enter the model's top 5 by escape</text>
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans', sans-serif" transform="translate(9.270719 451.896125)">fraction, displacing Q7915 (mean 230.3) and R5097 (mean 205.2), both of which have higher averages. R5097 falls</text>
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans', sans-serif" transform="translate(71.469188 462.198112)">from 4th to 14th. One instance of the grid-wide reordering finding (48.1% of grid points).</text>
  </g>

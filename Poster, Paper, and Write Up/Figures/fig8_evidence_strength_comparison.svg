  <g id="text_22">
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans', sans-serif" transform="translate(61.408828 428.886234)">The 6.87M-cell CyTOF cohort (Aim 12) shows a larger effect than any reconstructed-distribution</text>
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans', sans-serif" transform="translate(58.183281 439.524156)">check. A grid point counts when some reordered PAIR of patients differs by at least 2 percentage</text>
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans', sans-serif" transform="translate(69.368789 450.162078)">points in escape fraction; largest such pair spread 53.1 points. The effect survives sorting to</text>
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans', sans-serif" transform="translate(135.776016 460.8)">tumor cells (51.9%) and light-chain-purified tumor cells (40.7%).</text>
  </g>
